name: build

on:
  push:
    branches: [main]

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - run: cargo build --release
      - run: target/release/registry check
      - run: target/release/registry build
      - run: target/release/registry publish
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      - run: >
          gh release create "index-${{ github.run_number }}"
          dist/index.json dist/*.wasm dist/*.wasm.minisig
          --target "${{ github.sha }}"
          --title "Index ${{ github.run_number }}"
          --notes "Extensions built, signed and indexed from ${{ github.sha }}."
          --latest
        env:
          GH_TOKEN: ${{ github.token }}
