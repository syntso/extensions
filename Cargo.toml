[package]
name = "synt-registry"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Checks, builds, signs and indexes the Synt extensions"
repository = "https://github.com/syntso/extensions"
publish = false

[[bin]]
name = "registry"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
minisign = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unused_async_trait_impl = "allow"
